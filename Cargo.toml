[package]
name = "quickjs-oxide"
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
description = "A memory-safe Rust rewrite aiming for QuickJS feature parity"
license = "MIT"
repository = "https://github.com/pocket-stack/quickjs-oxide"

[workspace]
members = ["web/wasm"]
default-members = ["."]
resolver = "3"

[dependencies]
num-bigint = "=0.5.1"
num-traits = "=0.2.19"
tz-rs = "=0.7.3"

[features]
default = []
test262-host = []

[lib]
name = "quickjs_oxide"
path = "src/lib.rs"

[[bin]]
name = "qjs"
path = "src/main.rs"

[[bin]]
name = "run-test262"
path = "src/bin/run_test262.rs"
required-features = ["test262-host"]

[[test]]
name = "oracle_create_realm"
path = "tests/oracle_create_realm.rs"
required-features = ["test262-host"]

[[test]]
name = "oracle_host_gc"
path = "tests/oracle_host_gc.rs"
required-features = ["test262-host"]

[[test]]
name = "oracle_is_html_dda"
path = "tests/oracle_is_html_dda.rs"
required-features = ["test262-host"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.web]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
