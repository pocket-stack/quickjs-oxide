[package]
name = "quickjs-oxide"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
num-bigint = { workspace = true }
num-traits = { workspace = true }

[features]
default = []
test262-host = []
test-support = []
profiling = []
[dev-dependencies]
quickjs-oxide-host = { workspace = true, features = ["engine-test-support"] }

[workspace]
members = ["adapters/native", "adapters/web", ".", "apps/cli", "apps/web", "conformance/test262"]
default-members = [".", "apps/cli"]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/pocket-stack/quickjs-oxide"

[workspace.dependencies]
quickjs-oxide-web-host = { path = "adapters/web" }
quickjs-oxide-host = { path = "adapters/native" }
quickjs-oxide = { path = ".", default-features = false }
num-bigint = "=0.5.1"
num-traits = "=0.2.19"
tz-rs = "=0.7.3"
js-sys = { version = "=0.3.103", default-features = false }
wasm-bindgen = "=0.2.126"

[workspace.lints.rust]
unsafe_code = "forbid"
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.web]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
