[package]
name = "quickjs-oxide-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
quickjs-oxide-host = { workspace = true }
quickjs-oxide = { workspace = true }

[[bin]]
name = "qjs"
path = "src/main.rs"

[features]
default = []
test262-host = ["quickjs-oxide/test262-host"]
profiling = ["quickjs-oxide/profiling"]

[dev-dependencies]
quickjs-oxide = { workspace = true, features = ["test-support"] }
