# Focused R3bk profile for the refreshed for-await-of gate.
#
# The gate derives its manifest from every pinned executable Test262 path whose
# tracked name or source contains for-await, then subtracts the authenticated
# dependency ledger. Modules, dynamic import, IsHTMLDDA, and the
# upstream-skipped explicit-resource-management surface remain fail-closed.

[features]
Symbol
Symbol.asyncIterator
Symbol.iterator
async-functions
async-iteration
class
class-methods-private
class-static-methods-private
const
destructuring-binding
generators
object-rest
optional-chaining

