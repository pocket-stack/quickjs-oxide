# R3dh selection-only profile for the pinned SharedArrayBuffer core frontier.
#
# The feature set is the exact declared union of
# tests/test262-shared-array-buffer-core.txt plus the source-audited createRealm
# admission tag required by four paths. The runner authenticates both files and
# rejects --all, --test, or any other manifest. This profile only makes the
# 221-path frontier executable; it is not a global feature admission or a claim
# that the current quickjs-oxide runtime passes those tests.

