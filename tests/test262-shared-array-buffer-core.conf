DataView
Int8Array
Reflect
Reflect.construct
SharedArrayBuffer
Symbol
Symbol.species
Symbol.toStringTag
TypedArray
align-detached-buffer-semantics-with-web-reality
arraybuffer-transfer
arrow-function
cross-realm
host-create-realm-required
resizable-arraybuffer

[audited-negative-tests]
