# Focused R3af profile for ordinary async-generator functions.
#
# This profile is valid only with its hash-pinned 243-path manifest.
# Destructuring, yield-star, for-await, method syntax, Proxy, and realm/host
# dependencies remain fail-closed.

[features]
Reflect.construct
Symbol
Symbol.asyncIterator
Symbol.toStringTag
Symbol.unscopables
arrow-function
async-functions
async-iteration
default-parameters
globalThis
object-spread
rest-parameters

