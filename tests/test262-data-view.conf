# Checksum-bound capability profile for the pure DataView view-core cohort.
#
# TypedArray, SharedArrayBuffer, cross-realm, and immutable-buffer interop stay
# excluded until their own semantic layers land. Float16Array and
# resizable-arraybuffer remain scoped here and are not global capability claims.

[features]
ArrayBuffer
BigInt
DataView
DataView.prototype.getFloat32
DataView.prototype.getFloat64
DataView.prototype.getInt16
DataView.prototype.getInt32
DataView.prototype.getInt8
DataView.prototype.getUint16
DataView.prototype.getUint32
DataView.prototype.setUint8
Float16Array
Reflect.construct
Symbol
Symbol.toPrimitive
Symbol.toStringTag
arrow-function
class
computed-property-names
resizable-arraybuffer

[audited-negative-tests]
