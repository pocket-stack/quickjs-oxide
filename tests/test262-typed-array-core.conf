# Checksum-bound capability profile for the TypedArray shared core.
#
# This cohort covers the twelve concrete constructors, shared constructor
# algorithms, integer-indexed exotic semantics, basic view accessors,
# @@species/@@toStringTag, values/@@iterator, ArrayBuffer interop, and audited
# latent cross-builtin users. Prototype method families, SharedArrayBuffer,
# cross-realm hosts, and Annex B IsHTMLDDA remain in the exclusion ledger.
#
# Float16Array is exercised dynamically by pinned testTypedArray.js even though
# this Test262 commit predates a dedicated Float16Array constructor directory.

[features]
ArrayBuffer
BigInt
DataView
Int8Array
Proxy
Reflect
Reflect.construct
Reflect.set
Symbol
Symbol.isConcatSpreadable
Symbol.iterator
Symbol.species
Symbol.toPrimitive
Symbol.toStringTag
TypedArray
align-detached-buffer-semantics-with-web-reality
arraybuffer-transfer
arrow-function
class
generators
resizable-arraybuffer

[audited-negative-tests]
