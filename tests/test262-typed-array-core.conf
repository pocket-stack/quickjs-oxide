# Checksum-bound capability profile for the TypedArray shared core.
#
# This cohort covers the twelve concrete constructors, shared constructor
# algorithms, integer-indexed exotic semantics, basic view accessors,
# @@species/@@toStringTag, values/@@iterator, mutation methods
# (copyWithin/fill/reverse/set), indexed lookup/search methods
# (at/includes/indexOf/lastIndexOf), callback find methods
# (find/findIndex/findLast/findLastIndex), callback traversal/reduction and
# species-copy methods, `with`/`toReversed` change-by-copy, `join`,
# `toLocaleString`, inherited `toString` stringification, and stable
# `sort`/`toSorted`, ArrayBuffer interop, and audited latent cross-builtin
# users. Remaining prototype method families, SharedArrayBuffer, cross-realm
# hosts, and Annex B IsHTMLDDA stay in the exclusion ledger.
#
# Float16Array is exercised dynamically by pinned testTypedArray.js even though
# this Test262 commit predates a dedicated Float16Array constructor directory.

[features]
Array.prototype.includes
ArrayBuffer
BigInt
DataView
Int8Array
Proxy
Reflect
Reflect.construct
Reflect.set
Symbol
Symbol.isConcatSpreadable
Symbol.iterator
Symbol.species
Symbol.toPrimitive
Symbol.toStringTag
TypedArray
TypedArray.prototype.at
align-detached-buffer-semantics-with-web-reality
array-find-from-last
arraybuffer-transfer
arrow-function
change-array-by-copy
class
generators
resizable-arraybuffer
stable-typedarray-sort

[audited-negative-tests]
