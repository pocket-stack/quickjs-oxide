# Checksum-bound capability profile for the pure ArrayBuffer core cohort.
#
# TypedArray, DataView, SharedArrayBuffer, cross-realm, and immutable-buffer
# interop stay excluded until their own semantic layers land.

[features]
ArrayBuffer
BigInt
Reflect.construct
Symbol
Symbol.species
Symbol.toStringTag
align-detached-buffer-semantics-with-web-reality
arraybuffer-transfer
arrow-function
resizable-arraybuffer

[audited-negative-tests]
