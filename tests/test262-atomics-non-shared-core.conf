# R3de selection-only profile for the source-audited non-shared Atomics core.
#
# This profile is valid only with tests/test262-atomics-non-shared-core.txt;
# the runner authenticates both files and rejects --all, --test, or any other
# manifest. SharedArrayBuffer is present solely because one safe test carries
# that metadata tag without evaluating the constructor. This is not a claim
# that quickjs-oxide implements SharedArrayBuffer, agents, or shared memory.

[features]
Array.prototype.includes
ArrayBuffer
Atomics
Atomics.pause
BigInt
Reflect.construct
SharedArrayBuffer
Symbol
Symbol.toStringTag
TypedArray
resizable-arraybuffer

[audited-negative-tests]
