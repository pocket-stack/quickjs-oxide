# Checksum-bound Test262 capability profile for the active Proxy cohort.
#
# Every metadata feature used by the pinned manifest is admitted only inside
# this scoped cohort. Failures remain visible conformance gaps, while realm and
# module host requirements stay fail-closed before execution.

[features]
Array.prototype.includes
BigInt
Proxy
Reflect
Reflect.construct
Reflect.set
Reflect.setPrototypeOf
Symbol
Symbol.hasInstance
Symbol.isConcatSpreadable
Symbol.iterator
Symbol.match
Symbol.replace
Symbol.species
Symbol.toStringTag
TypedArray
__getter__
__proto__
__setter__
align-detached-buffer-semantics-with-web-reality
arrow-function
async-functions
async-iteration
class
class-fields-private
class-fields-public
class-methods-private
cross-realm
destructuring-binding
dynamic-import
generators
import-attributes
json-modules
object-rest
object-spread
proxy-missing-checks

[audited-negative-tests]

[execution]
async=true
