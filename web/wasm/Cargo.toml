[package]
name = "quickjs-oxide-web"
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
js-sys = { version = "=0.3.103", default-features = false }
quickjs-oxide = { path = "../.." }
wasm-bindgen = "=0.2.126"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
